<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>방문 통계 · 원성민 포트폴리오</title>
    <style>
      :root {
        --bg: #fbfbfa; --elev: #fff; --fg: #1a1a1a; --muted: #6b6b6b;
        --border: #e6e4e0; --accent: #2f6f4f; --accent-fg: #fff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16161a; --elev: #1e1e24; --fg: #ececec; --muted: #a0a0a8;
          --border: #2c2c34; --accent: #5fb98a; --accent-fg: #10231a;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--fg);
        font-family: 'Pretendard Variable', 'Pretendard', -apple-system, 'Apple SD Gothic Neo',
          'Segoe UI', 'Malgun Gothic', sans-serif;
        line-height: 1.6; word-break: keep-all;
      }
      .bar {
        display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
        padding: 0.9rem 1.25rem; border-bottom: 1px solid var(--border);
        background: var(--elev); position: sticky; top: 0;
      }
      .bar strong { font-size: 1rem; margin-right: auto; }
      .bar a {
        color: var(--muted); text-decoration: none; font-size: 0.9rem;
        padding: 0.35rem 0.6rem; border-radius: 8px;
      }
      .bar a:hover { color: var(--fg); background: var(--border); }
      .wrap { max-width: 60rem; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
      h1 { font-size: 1.3rem; margin: 0.5rem 0 0.25rem; }
      p.sub { color: var(--muted); margin: 0 0 1.5rem; font-size: 0.92rem; }
      .quicklinks { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-bottom: 1.75rem; }
      .quicklinks a {
        display: inline-flex; align-items: center; gap: 0.35rem;
        padding: 0.5rem 0.95rem; border-radius: 999px; text-decoration: none;
        font-size: 0.85rem; font-weight: 600;
        background: color-mix(in srgb, var(--accent) 12%, var(--elev));
        border: 1px solid color-mix(in srgb, var(--accent) 38%, transparent);
        color: var(--accent);
      }
      .quicklinks a:hover { background: var(--accent); color: var(--accent-fg); }
      .report {
        width: 100%; height: min(80vh, 900px); border: 1px solid var(--border);
        border-radius: 12px; background: var(--elev);
      }
      .setup {
        border: 1px dashed var(--border); border-radius: 12px;
        padding: 1.5rem 1.5rem 1.75rem; background: var(--elev); font-size: 0.9rem;
      }
      .setup h2 { font-size: 1rem; margin: 0 0 0.75rem; }
      .setup ol { margin: 0; padding-left: 1.3rem; }
      .setup li { margin: 0.4rem 0; }
      .setup code {
        background: color-mix(in srgb, var(--fg) 8%, transparent);
        padding: 0.1em 0.4em; border-radius: 5px; font-size: 0.88em;
      }
      .setup a { color: var(--accent); }
      .note { color: var(--muted); font-size: 0.82rem; margin-top: 1rem; }
    </style>
  </head>
  <body>
    <div class="bar">
      <strong>방문 통계</strong>
      <a href="./">← 콘텐츠 편집</a>
      <a href="../" target="_blank" rel="noopener">사이트 ↗</a>
    </div>

    <div class="wrap">
      <h1>방문 통계</h1>
      <p class="sub">Firebase(Google Analytics) 데이터. 페이지별 조회수·평균 참여시간·유입 경로 등.</p>

      <div class="quicklinks">
        <a href="https://console.firebase.google.com/project/portfolio-b4bc3/analytics/realtime" target="_blank" rel="noopener">실시간 방문자</a>
        <a href="https://console.firebase.google.com/project/portfolio-b4bc3/analytics" target="_blank" rel="noopener">Firebase 대시보드</a>
        <a href="https://analytics.google.com/analytics/web/" target="_blank" rel="noopener">GA4 보고서</a>
      </div>

      <div id="mount"></div>

      <p class="note">
        표준 보고서(페이지별·참여시간)는 첫 데이터가 쌓이는 데 24~48시간 걸립니다. 즉시 확인은 "실시간 방문자".
      </p>
    </div>

    <script>
      // ┌─────────────────────────────────────────────────────────────────┐
      // │ 여기에 Looker Studio "보고서 삽입(Embed)" URL 을 넣으면            │
      // │ 대시보드가 이 페이지에 바로 표시됩니다. 비워두면 설정 안내가 나옵니다. │
      // └─────────────────────────────────────────────────────────────────┘
      const LOOKER_EMBED_URL = '';

      const mount = document.getElementById('mount');
      if (LOOKER_EMBED_URL) {
        const f = document.createElement('iframe');
        f.className = 'report';
        f.src = LOOKER_EMBED_URL;
        f.setAttribute('frameborder', '0');
        f.setAttribute('allowfullscreen', '');
        f.setAttribute('sandbox', 'allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox');
        mount.appendChild(f);
      } else {
        mount.innerHTML = `
          <div class="setup">
            <h2>대시보드를 이 페이지에 붙이려면 (1회, 무료)</h2>
            <ol>
              <li><a href="https://lookerstudio.google.com" target="_blank" rel="noopener">Looker Studio</a> 접속 → <b>빈 보고서 만들기</b></li>
              <li>데이터 연결에서 <b>Google 애널리틱스</b> → <code>portfolio</code> 속성 선택 → 추가</li>
              <li>원하는 표/차트 배치 (예: "페이지 경로 + 조회수 + 평균 참여 시간" 표)</li>
              <li>우상단 <b>공유 → 보고서 삽입</b> → <b>삽입 사용</b> 켜기 → <b>URL 복사</b></li>
              <li>이 파일 <code>public/admin/stats.html</code> 의 <code>LOOKER_EMBED_URL</code> 에 붙여넣고 커밋
                (또는 저에게 URL 을 주시면 넣어드립니다)</li>
            </ol>
            <p class="note">
              삽입을 켜면 URL 을 가진 사람은 이 통계를 볼 수 있게 됩니다(개인 방문수 수준). 민감하면 위 "Firebase 대시보드" 링크만 쓰세요.
            </p>
          </div>`;
      }
    </script>
  </body>
</html>

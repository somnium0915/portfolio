backend:
  name: github
  repo: somnium0915/portfolio
  branch: main
  # OAuth 앱 없이 GitHub 개인 액세스 토큰(PAT)으로 로그인합니다.
  # (Sveltia CMS 로그인 화면에서 "Use a personal access token")

# 로컬(npm run dev)에서 admin 을 열면 로컬 파일을 직접 편집
local_backend: true

# 이미지 업로드 위치 (저장소 public/images/, 사이트에선 /portfolio/images/... 로 참조됨)
media_folder: "public/images"
public_folder: "/portfolio/images"

# 파일명(슬러그)에 한글 허용
slug:
  encoding: unicode
  clean_accents: false
  sanitize_replacement: "-"

# 저장 전 실시간 미리보기 패널은 끔 (실제 미리보기는 사이트/`npm run dev` 에서)
editor:
  preview: false

collections:
  # ─────────────────────────────  사이트 설정  ─────────────────────────────
  - name: settings
    label: 사이트 설정
    editable: true
    files:
      # 소개 페이지의 "즐겨 하는 게임" 목록 (src/data/games.json)
      - name: games
        label: "소개: 즐겨 하는 게임"
        file: "src/data/games.json"
        fields:
          - { name: title, label: 제목, widget: string }
          - { name: note, label: 설명, widget: text, required: false }
          - name: groups
            label: 묶음
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: "묶음 이름 (예: 대전 격투)", widget: string }
              - name: games
                label: 게임
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { name: name, label: 게임 이름, widget: string }
                  - { name: main, label: "오래 한 게임 (밝게 표시)", widget: boolean, default: false, required: false }
                  - { name: analysis, label: "분석서 파일 이름 (있을 때만, 확장자 제외)", widget: string, required: false }
              - { name: more, label: "묶음 끝 한 줄 (선택)", widget: string, required: false }
      - name: home
        label: 메인 화면 · 사이트 정보
        file: "src/data/site.json"
        fields:
          - { name: title, label: "브라우저 탭 / 공유 제목", widget: string }
          - { name: description, label: "메타 설명 (검색·SNS 미리보기)", widget: text }
          - { name: author, label: "이름 (헤더·푸터)", widget: string }
          - name: hero
            label: 상단 큰 영역
            widget: object
            fields:
              - { name: role, label: "큰 문구 위 한 줄 (직무·이름)", widget: string, required: false }
              - { name: tagline, label: 큰 문구, widget: text, hint: "줄바꿈이 그대로 화면 줄바꿈이 됩니다" }
              - { name: intro, label: 부제, widget: text }
          - name: contact
            label: 연락처
            widget: object
            fields:
              - { name: email, label: 이메일, widget: string, required: false }
              - { name: github, label: GitHub 주소, widget: string, required: false }
          - name: profile
            label: "프로필 (이력서 대용)"
            widget: object
            required: false
            hint: "비운 칸은 화면에 나오지 않습니다. 사진·학력 등이 하나라도 있어야 블록이 보입니다"
            fields:
              - { name: photo, label: 사진 (세로 3:4 권장), widget: image, required: false }
              - { name: name, label: 이름, widget: string, required: false }
              - { name: nameEn, label: 영문 이름, widget: string, required: false }
              - { name: position, label: 지원 분야, widget: string, required: false }
              - { name: birth, label: 생년, widget: string, required: false }
              - { name: location, label: 거주지, widget: string, required: false, hint: "공개 사이트이므로 시·구 단위까지만 권장" }
              - { name: phone, label: 연락처, widget: string, required: false, hint: "공개 사이트에 노출됩니다" }
              - { name: email, label: "이메일 (비우면 연락처 이메일)", widget: string, required: false }
              - name: education
                label: 학력
                widget: list
                required: false
                summary: "{{fields.period}} {{fields.title}}"
                fields:
                  - { name: period, label: 기간, widget: string, required: false }
                  - { name: title, label: 항목, widget: string }
                  - { name: detail, label: 설명, widget: string, required: false }
              - name: experience
                label: "연혁 (경력·활동)"
                widget: list
                required: false
                summary: "{{fields.period}} {{fields.title}}"
                fields:
                  - { name: period, label: 기간, widget: string, required: false }
                  - { name: title, label: 항목, widget: string }
                  - { name: detail, label: 설명, widget: string, required: false }
              - name: awards
                label: 수상
                widget: list
                required: false
                summary: "{{fields.period}} {{fields.title}}"
                fields:
                  - { name: period, label: 기간, widget: string, required: false }
                  - { name: title, label: 항목, widget: string }
                  - { name: detail, label: 설명, widget: string, required: false }
              - name: certificates
                label: 자격·어학
                widget: list
                required: false
                summary: "{{fields.period}} {{fields.title}}"
                fields:
                  - { name: period, label: 기간, widget: string, required: false }
                  - { name: title, label: 항목, widget: string }
                  - { name: detail, label: 설명, widget: string, required: false }
          - name: principles
            label: "'이 문장을 고른 이유' 블록"
            widget: object
            required: false
            fields:
              - { name: title, label: 제목, widget: string }
              - { name: reason, label: 이유 문단, widget: text, required: false }
              - name: items
                label: 원칙
                widget: list
                required: false
                summary: "{{fields.title}}"
                fields:
                  - { name: title, label: 원칙 이름, widget: string }
                  - { name: text, label: 설명, widget: text }
              - { name: methodTitle, label: 일하는 방식 제목, widget: string, required: false }
              - name: method
                label: 일하는 방식 (순서대로)
                widget: list
                required: false
                summary: "{{fields.title}}"
                fields:
                  - { name: title, label: 단계 이름, widget: string }
                  - { name: text, label: 설명, widget: text }
          - name: featured
            label: "'대표 작업' 블록"
            widget: object
            fields:
              - { name: title, label: 제목, widget: string }
              - { name: note, label: 부제, widget: string, required: false }
          - name: skills
            label: "'보유 기술' 블록"
            widget: object
            fields:
              - { name: enabled, label: 홈에 표시, widget: boolean, default: true, required: false, hint: "끄면 블록 전체가 숨겨집니다 (목록은 유지)" }
              - { name: title, label: 제목, widget: string }
              - { name: note, label: 부제, widget: string, required: false }
              - name: items
                label: 기술 목록
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { name: name, label: 이름, widget: string }
                  - { name: icon, label: 로고 이미지, widget: image, required: false, choose_url: true, hint: "비우면 이름 첫 글자로 표시됩니다" }
                  - { name: use, label: 쓰는 일, widget: string, required: false, hint: "예: UI 설계와 시안. 이력의 사용 도구 표에 나옵니다" }
                  - { name: url, label: 링크(선택), widget: string, required: false }
          - name: sections
            label: 섹션별 한 줄 설명
            widget: object
            fields:
              - { name: projects, label: 프로젝트, widget: string }
              - { name: designs, label: 기획서, widget: string }
              - { name: analyses, label: 분석서, widget: string }

  # ─────────────────────────────  프로젝트  ─────────────────────────────
  - name: projects
    label: 프로젝트
    label_singular: 프로젝트
    folder: "src/content/projects"
    extension: md
    format: frontmatter
    create: true
    slug: "{{fields.title}}"
    summary: "{{title}}"
    fields:
      - { name: title, label: 제목, widget: string }
      - { name: summary, label: 요약(카드·검색 미리보기), widget: text, required: false }
      - { name: date, label: 날짜, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { name: updated, label: 수정일, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }
      - { name: tags, label: 태그, widget: list, required: false }
      - { name: cover, label: 커버 이미지, widget: image, required: false, choose_url: true }
      - { name: status, label: 상태, widget: select, options: ["published", "draft"], default: "published" }
      - { name: featured, label: 홈 상단 "대표 작업" 에 노출, widget: boolean, default: false }
      - { name: order, label: 정렬 우선순위(작을수록 위, 비우면 날짜순), widget: number, required: false, value_type: int }
      - name: links
        label: 바로가기 링크
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: demo, label: Demo, widget: string, required: false }
          - { name: repo, label: Repo, widget: string, required: false }
          - { name: figma, label: Figma, widget: string, required: false }
          - { name: drive, label: Drive, widget: string, required: false }
          - { name: video, label: Video, widget: string, required: false }
          - { name: notion, label: Notion, widget: string, required: false }
          - { name: docs, label: Docs, widget: string, required: false }
      - name: pdf
        label: 첨부 PDF (Drive 파일/폴더 링크)
        widget: list
        required: false
        summary: "{{fields.label}} {{fields.url}}"
        fields:
          - { name: url, label: URL, widget: string }
          - { name: label, label: 라벨, widget: string, required: false }
      - { name: role, label: 역할, widget: string, required: false }
      - { name: team, label: 팀, widget: string, required: false }
      - { name: period, label: 기간, widget: string, required: false }
      - { name: stack, label: 스택, widget: list, required: false }
      - { name: highlights, label: "기획 의도 (홈 대표 작업 카드, '의도: 적용 예' 형식 2~3줄)", widget: list, required: false }
      - name: areas
        label: "맡은 영역 (홈 대표 작업, 상세 페이지)"
        widget: object
        required: false
        collapsed: true
        hint: "맡은 영역에 주도 또는 공동을 고르세요. 안 맡았으면 비워 둡니다"
        fields:
          - { name: plan, label: 기획, widget: select, options: ["주도", "공동"], required: false }
          - { name: ui, label: UI, widget: select, options: ["주도", "공동"], required: false }
          - { name: system, label: 시스템, widget: select, options: ["주도", "공동"], required: false }
          - { name: dev, label: 구현, widget: select, options: ["주도", "공동"], required: false }
          - { name: release, label: 빌드·배포, widget: select, options: ["주도", "공동"], required: false }
      - { name: body, label: 본문, widget: markdown }

  # ─────────────────────────────  기획서  ─────────────────────────────
  - name: designs
    label: 기획서
    label_singular: 기획서
    folder: "src/content/designs"
    extension: md
    format: frontmatter
    create: true
    slug: "{{fields.title}}"
    summary: "{{title}}"
    fields:
      - { name: title, label: 제목, widget: string }
      - { name: summary, label: 요약(카드·검색 미리보기), widget: text, required: false }
      - { name: date, label: 날짜, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { name: updated, label: 수정일, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }
      - { name: tags, label: 태그, widget: list, required: false }
      - { name: cover, label: 커버 이미지, widget: image, required: false, choose_url: true }
      - { name: status, label: 상태, widget: select, options: ["published", "draft"], default: "published" }
      - { name: featured, label: 홈 상단 "대표 작업" 에 노출, widget: boolean, default: false }
      - { name: order, label: 정렬 우선순위(작을수록 위, 비우면 날짜순), widget: number, required: false, value_type: int }
      - name: links
        label: 바로가기 링크
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: demo, label: Demo, widget: string, required: false }
          - { name: repo, label: Repo, widget: string, required: false }
          - { name: figma, label: Figma, widget: string, required: false }
          - { name: drive, label: Drive, widget: string, required: false }
          - { name: video, label: Video, widget: string, required: false }
          - { name: notion, label: Notion, widget: string, required: false }
          - { name: docs, label: Docs, widget: string, required: false }
      - name: pdf
        label: 첨부 PDF (Drive 파일/폴더 링크)
        widget: list
        required: false
        summary: "{{fields.label}} {{fields.url}}"
        fields:
          - { name: url, label: URL, widget: string }
          - { name: label, label: 라벨, widget: string, required: false }
      - { name: game, label: 대상 게임, widget: string, required: false }
      - { name: docType, label: 문서 유형, widget: string, default: "기획서", required: false }
      - { name: body, label: 본문, widget: markdown }

  # ─────────────────────────────  분석서  ─────────────────────────────
  - name: analyses
    label: 분석서
    label_singular: 분석서
    folder: "src/content/analyses"
    extension: md
    format: frontmatter
    create: true
    slug: "{{fields.title}}"
    summary: "{{title}}"
    # 노션에서 가져온 분석서(mode: import-once)도 저장소에 커밋되므로 여기서 편집됩니다.
    # notionUrl / sourceCategory / generator 는 노션 출처 표시용 — 편집 시 값이 유지되도록 hidden 으로 둡니다.
    fields:
      - { name: title, label: 제목, widget: string }
      - { name: summary, label: 요약(카드·검색 미리보기), widget: text, required: false }
      - { name: date, label: 날짜, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { name: updated, label: 수정일, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }
      - { name: tags, label: 태그, widget: list, required: false }
      - { name: cover, label: 커버 이미지, widget: image, required: false, choose_url: true }
      - { name: status, label: 상태, widget: select, options: ["published", "draft"], default: "published" }
      - { name: featured, label: 홈 상단 "대표 작업" 에 노출, widget: boolean, default: false }
      - { name: order, label: 정렬 우선순위(작을수록 위, 비우면 날짜순), widget: number, required: false, value_type: int }
      - { name: notionUrl, widget: hidden, required: false }
      - { name: sourceCategory, widget: hidden, required: false }
      - { name: generator, widget: hidden, required: false }
      - name: links
        label: 바로가기 링크
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: demo, label: Demo, widget: string, required: false }
          - { name: repo, label: Repo, widget: string, required: false }
          - { name: figma, label: Figma, widget: string, required: false }
          - { name: drive, label: Drive, widget: string, required: false }
          - { name: video, label: Video, widget: string, required: false }
          - { name: notion, label: Notion, widget: string, required: false }
          - { name: docs, label: Docs, widget: string, required: false }
      - name: pdf
        label: 첨부 PDF (Drive 파일/폴더 링크)
        widget: list
        required: false
        summary: "{{fields.label}} {{fields.url}}"
        fields:
          - { name: url, label: URL, widget: string }
          - { name: label, label: 라벨, widget: string, required: false }
      - { name: subject, label: 분석 대상, widget: string, required: false }
      - { name: platform, label: 플랫폼, widget: string, required: false }
      - { name: body, label: 본문, widget: markdown }

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>콘텐츠 편집 · 원성민 포트폴리오</title>
    <style>
      /* Sveltia CMS UI 위에 떠 있는 방문 통계 바로가기 */
      #pf-stats-link {
        position: fixed;
        right: 14px;
        bottom: 14px;
        z-index: 2147483647;
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.5rem 0.9rem;
        border-radius: 999px;
        font: 600 0.85rem/1 -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif;
        text-decoration: none;
        color: #fff;
        background: #2f6f4f;
        box-shadow: 0 3px 14px rgba(0, 0, 0, 0.25);
      }
      #pf-stats-link:hover {
        background: #245b40;
      }
    </style>
  </head>
  <body>
    <a id="pf-stats-link" href="./stats.html">📊 방문 통계</a>

    <!-- Sveltia CMS: Git 기반 콘텐츠 편집기. 저장하면 GitHub 저장소에 커밋되고 자동 배포됩니다. -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>

    <script>
      // Sveltia 가 body 를 재구성하는 경우를 대비해, 통계 링크가 사라지면 다시 붙인다.
      (function () {
        var keep = function () {
          if (!document.getElementById('pf-stats-link')) {
            var a = document.createElement('a');
            a.id = 'pf-stats-link';
            a.href = './stats.html';
            a.textContent = '📊 방문 통계';
            document.body.appendChild(a);
          }
        };
        setInterval(keep, 1500);
      })();
    </script>
  </body>
</html>
